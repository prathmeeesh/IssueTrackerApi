name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # Keep preinstalled newer SDKs from overriding the selected .NET 8 SDK.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore IssueTrackerApi.sln

      - name: Build
        run: dotnet build IssueTrackerApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IssueTrackerApi.sln --configuration Release --no-build
